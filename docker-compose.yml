# Local PostgreSQL for the WOLVENWEAR API.  `docker compose up -d db`
# Matches server/.env.example: postgresql://wolven:wolven@localhost:5432/wolvenwear
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wolven
      POSTGRES_PASSWORD: wolven
      POSTGRES_DB: wolvenwear
    ports:
      - "5432:5432"
    volumes:
      - wolvenwear-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolven -d wolvenwear"]
      interval: 5s
      retries: 10

volumes:
  wolvenwear-db:
